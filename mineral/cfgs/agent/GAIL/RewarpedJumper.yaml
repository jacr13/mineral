defaults:
  - PPO/RewarpedJumper
  - PointNet
  - _self_

seed: ${..seed}
algo: GAIL

gail:
  demos:
    path: ""
    n_trajs: 10
    subsample_factor: 1 # 1 means no subsampling, >1 means subsample by this factor

  # discriminator network
  input_type: state_action # 'state', 'state_action', or 'state_state'
  disc_update_freq: 3 # frequency (in epochs) to update discriminator
  discriminator:
    iters: 1
    mlp_kwargs:
      units: [256, 256]
      norm_type: LayerNorm
      act_type: SiLU
    optim:
      type: Adam
      kwargs: { lr: 3e-4 }

  expert_batch_size: 2048
  policy_batch_size: 2048
  reward_scale: 1.0
  label_smooth: 0.0
