defaults:
  - DFlexAntPPO

seed: ${..seed}
algo: GAIL

gail:
  demos:
    path: ""
    num: 10

  # discriminator network
  input_type: state_action # 'state', 'state_action', or 'state_state'
  discriminator:
    iters: 1
    mlp_kwargs:
      units: [256, 256]
      norm_type: LayerNorm
      act_type: SiLU
    encoder_kwargs: null
    optim:
      type: Adam
      kwargs: { lr: 3e-4 }

  expert_batch_size: 2048
  policy_batch_size: 2048
  reward_scale: 1.0
  label_smooth: 0.0
