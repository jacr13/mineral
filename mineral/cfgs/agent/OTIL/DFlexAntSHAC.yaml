defaults:
  - /agent/SHAC/DFlexAnt@_here_
  - _self_

algo: OTIL

otil:
  demos:
    path: ""
    n_trajs: 10
    subsample_factor: 1 # 1 means no subsampling, >1 means subsample by this factor

  input_type: state # state | state_state
  loss_ot_cost_type: l2 # l2 | huber | cosine
  # Sinkhorn/softmin settings of the reported runs. huber_speedup computes the
  # plan on a Huber cost while scoring with the configured cost, so it is off:
  # every reported run set it false.
  loss_ot_eps: 0.1
  loss_ot_iters: 60
  loss_ot_huber_delta: 1.0
  loss_use_huber_speedup: false
  loss_mlp_features_dim: null
  loss_use_detached_prev_obs: true
  loss_best_of_k_k: 8
  loss_best_of_k_tau: 0.5

  critic_reward_shapping: true
  critic_disabled: False
  critic_reward_mapping: log_exp # neg | exp | log_exp
  critic_reward_scale: 1.0
  critic_reward_normalize: ${..shac.normalize_ret}
  imitation_loss_type: ot # ot | l2 | cosine
  actor_value_return_type: min
