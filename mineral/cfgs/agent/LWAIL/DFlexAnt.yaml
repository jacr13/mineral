defaults:
  - /agent/DDPG/DFlexAnt@_here_
seed: ${..seed}
algo: LWAIL

ddpg:
  # DDPG/DFlexAnt.yaml's own default (`max_grad_norm: null`) makes
  # `optimizer_update` return `grad_norm=None`, which crashes `train()`'s
  # `torch.stack(results["grad_norm/..."])` metric summary (a pre-existing
  # DDPG bug, unrelated to LWAIL); set a real value to avoid it.
  max_grad_norm: 0.5
  # upstream Table 8: critic LR 0.001 (actor LR stays at DDPG/DFlexAnt.yaml's
  # own default of 3e-4, which already matches Table 8's actor LR).
  critic_optim_kwargs: { lr: 1e-3 }

lwail:
  demos:
    path: ""
    n_trajs: 8
    subsample_factor: 1 # upstream does no subsampling; 1 = no subsampling, >1 keeps every nth step

  # upstream default run (run.bash/all_run.bash) uses state_state + --minus,
  # i.e. the critic sees (obs, next_obs - obs) pairs; see `minus` below.
  input_type: state_state
  # upstream Table 8: discriminator updates every 4000 env steps. One epoch
  # here collects `ddpg.horizon_len (1) * num_actors (64) = 64` env steps, so
  # disc_update_freq=63 -> an update every 63*64=4032 steps, closest integer
  # match to 4000. (Recompute this if horizon_len or num_actors changes.)
  disc_update_freq: 63
  discriminator:
    iters: 40 # upstream Table 8 "Update Epoch" (run.bash uses --f_epoch 30; code and paper disagree, using the paper's reported value)
    mlp_kwargs:
      units: [64, 64]
      norm_type: null # upstream's `FullyConnectedNet` is plain Linear+ReLU, no norm
      act_type: ReLU
    encoder_kwargs: null
    optim:
      type: Adam
      kwargs: { lr: 1e-3 } # upstream `--lr_f` / Table 8

  expert_batch_size: 4000 # upstream Table 8: batch size = update_timestep = 4000
  policy_batch_size: 4000
  reward_scale: 1.0

  gp_coef: 10 # upstream `--alpha`, the gradient-penalty coefficient
  minus: true # upstream `--minus`: critic sees (obs, next_obs - obs) instead of (obs, next_obs)
  pretrain_iters: 2500 # upstream hardcodes 2500 epochs in `core.py::Agent.pretrain`

  # upstream `--using_icvf`: embed states through a frozen ICVF encoder before
  # the critic. Turned on: without it, the raw-state Wasserstein critic
  # saturates (IPM -> -2, maximally confident) within the first ~300K steps on
  # ant/humanoid/snu_humanoid, collapsing the reward signal almost everywhere
  # except states identical to the demo (observed in lwail-sweep-* wandb
  # runs); the paper's own ablation attributes exactly this robustness to
  # ICVF as task dimensionality grows. The first run for a given `icvf_path`
  # (default: icvf_model/dflex_<env_name>.pt) pretrains one from a random
  # rollout and caches it there; every later run (other seeds, sweeps) just
  # loads it.
  using_icvf: true
  icvf_path: "" # "" = default to icvf_model/dflex_<env_name>.pt
  icvf_hidden_dims: [256, 256]
  icvf_pretrain:
    num_transitions: 10000 # upstream: "10K state pairs collected from random rollouts" (Table 8 / Sec. 4.2)
    train_steps: 20000
    batch_size: 256
    lr: 3e-4
    discount: 0.99
    expectile: 0.9
    target_update_rate: 0.005
    p_randomgoal: 0.3
    p_trajgoal: 0.5
    p_currgoal: 0.2
    p_samegoal: 0.5
    log_every: 1000
