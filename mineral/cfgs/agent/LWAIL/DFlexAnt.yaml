defaults:
  - /agent/DDPG/DFlexAnt@_here_
seed: ${..seed}
algo: LWAIL

ddpg:
  # DDPG/DFlexAnt.yaml's own default (`max_grad_norm: null`) makes
  # `optimizer_update` return `grad_norm=None`, which crashes `train()`'s
  # `torch.stack(results["grad_norm/..."])` metric summary (a pre-existing
  # DDPG bug, unrelated to LWAIL); set a real value to avoid it.
  max_grad_norm: 0.5

lwail:
  demos:
    path: ""
    n_trajs: 8
    subsample_factor: 1 # upstream does no subsampling; 1 = no subsampling, >1 keeps every nth step

  # upstream default run (run.bash/all_run.bash) uses state_state + --minus,
  # i.e. the critic sees (obs, next_obs - obs) pairs; see `minus` below.
  input_type: state_state
  disc_update_freq: 1
  discriminator:
    iters: 30 # upstream `--f_epoch 30`, as used in run.bash/all_run.bash
    mlp_kwargs:
      units: [64, 64]
      norm_type: null # upstream's `FullyConnectedNet` is plain Linear+ReLU, no norm
      act_type: ReLU
    encoder_kwargs: null
    optim:
      type: Adam
      kwargs: { lr: 1e-3 } # upstream `--lr_f`

  expert_batch_size: 2048
  policy_batch_size: 2048
  reward_scale: 1.0

  gp_coef: 10 # upstream `--alpha`, the gradient-penalty coefficient
  minus: true # upstream `--minus`: critic sees (obs, next_obs - obs) instead of (obs, next_obs)
  pretrain_iters: 2500 # upstream hardcodes 2500 epochs in `core.py::Agent.pretrain`

  # upstream `--using_icvf`: embed states through a frozen ICVF encoder before
  # the critic. Off by default: upstream only ships ICVF checkpoints for a few
  # D4RL Mujoco tasks (dimension-incompatible with this repo's dflex tasks).
  # When enabled, the first run for a given `icvf_path` (default:
  # icvf_model/dflex_<env_name>.pt) pretrains one from a random rollout and
  # caches it there; every later run (other seeds, sweeps) just loads it.
  using_icvf: false
  icvf_path: "" # "" = default to icvf_model/dflex_<env_name>.pt
  icvf_hidden_dims: [256, 256]
  icvf_pretrain:
    num_transitions: 10000 # upstream: "10K state pairs collected from random rollouts" (Table 8 / Sec. 4.2)
    train_steps: 20000
    batch_size: 256
    lr: 3e-4
    discount: 0.99
    expectile: 0.9
    target_update_rate: 0.005
    p_randomgoal: 0.3
    p_trajgoal: 0.5
    p_currgoal: 0.2
    p_samegoal: 0.5
    log_every: 1000
