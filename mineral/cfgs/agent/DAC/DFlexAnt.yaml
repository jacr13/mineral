defaults:
  - /agent/SAC/DFlexAnt@_here_
seed: ${..seed}
algo: DAC

dac:
  demos:
    path: ""
    n_trajs: 8
    subsample_factor: 20 # 0 means no subsampling, >1 means subsample by this factor

  input_type: state_action # 'state', 'state_action', or 'state_state'
  disc_update_freq: 1
  discriminator:
    iters: 1
    mlp_kwargs:
      units: [256, 256]
      norm_type: LayerNorm
      act_type: SiLU
    encoder_kwargs: null
    optim:
      type: Adam
      kwargs: { lr: 3e-4 }

  expert_batch_size: 2048
  policy_batch_size: 2048
  reward_scale: 1.0
  label_smooth: 0.0

  inverse_model:
    enabled: true
    reg_coef: 0.1
    update_freq: 1
    mlp_kwargs:
      units: [256, 256]
      norm_type: LayerNorm
      act_type: SiLU
    encoder_kwargs: null
    optim:
      type: Adam
      kwargs: { lr: 3e-4 }
