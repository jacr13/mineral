# MENTOR: Mimicking Expert states by iNverting the simulaTOR (state-only imitation, DFlex).
# Defaults are the Hopper recipe; tasks/mentor/*.yaml set the Ant / Humanoid ones.
seed: ${..seed}
algo: MENTOR

print_every: 1
ckpt_every: 1  # in DAgger rounds

# Rerun evaluation protocol (Agent.protocol_*): final score and evaluations on a dedicated env, as every method.
# MENTOR's step counter (agent_steps) is the total of simulator steps of every phase (learner rollouts, Stage I,
# teacher plans, replays, Jacobians). The policy only changes when a round's fit ends, so MENTOR calls
# protocol_step() once per round (round 0 = Stage I + cloning) and once before Stage I: with eval_every_steps 1 every
# round is evaluated; a larger value evaluates the first round end after each multiple of it.
protocol_eval: false
eval_every_steps: 0

network:
  normalize_input: False  # the policy standardises inputs with the demo statistics
  units: [256, 256]
  squash: tanh  # tanh, or clip: linear output in training, clipped to [-1, 1] when acting

mentor:
  num_actors: ${...task.env.numEnvs}
  rounds: 10
  # > 0: no new round starts once the total simulator steps reach this (budget-matched runs); 0 = rounds only
  max_sim_steps: 0
  # Rewarped tasks only (full-state MENTOR): observation keys ('name', 'name:a:b' slices) and the Stage I rule
  # (joint_velocity: actions read off joint displacements; invert: Levenberg-Marquardt through the simulator)
  obs_keys: "joint_q|com_q"
  stage1: joint_velocity
  eval_episodes_per_env: 2  # as SHAC/FOCUS eval: num_actors * 2 episodes

  demos:
    path: ""
    n_trajs: 8
    subsample_factor: 1

  # Stage I: Levenberg-Marquardt action inversion of every demo transition
  invert:
    method: lm  # lm: Levenberg-Marquardt (Jacobian from fd / broyden / autodiff); adam: Adam through one simulator step
    adam_lr: 0.05  # method adam (iters = Adam iterations)
    batch: 2000
    iters: 5
    starts: 1
    param: box  # box: clip each step to [-1, 1]; tanh: optimise u with a = tanh(u) (many actions at a bound)
    reg: 0.0  # > 0 picks a minimum-norm solution for over-actuated bodies (SNU)
    reg_kind: l2  # l2: reg ||a||^2 (favours half-activated muscles); activation: reg * sum (a+1)/2 (total activation)
    jacobian: fd  # fd: finite differences every iteration; broyden: once per start, then rank-1 updates; autodiff: exact
    refresh: 0  # broyden only: recompute the finite-difference Jacobian every this many iterations (0 = never)
    refresh_jacobian: fd  # broyden refreshes from fd or autodiff (exact, through the simulator's backward pass)
    fd_step: 0.01  # forward-difference step (SNU: the simulator is nondeterministic, F is linear in activations -> 0.1)
    # temporal smoothness: after the solve, smooth_sweeps re-solves (sweep_iters each, warm-started) with
    # + smooth ||a_t - mean(a_t-1, a_t+1)||^2 within each demo; every residual is still one simulator step
    smooth: 0.0
    smooth_sweeps: 0
    sweep_iters: 10
    # policy prior: every relabel_every rounds, re-solve the Stage I labels with reg ||a - pi(s_t)||^2 (relabel_iters,
    # warm-started); over-actuated bodies (SNU) then get the null-space part of each label from the policy
    policy_prior: False
    relabel_every: 1
    relabel_iters: 10
    audit_true_actions: False  # AUDIT ONLY: use the stored expert actions instead of the recovered ones (not state-only)

  # Stage II: rejoin teacher
  teacher:
    kind: rejoin  # rejoin: K-step plan onto a demo window; tvlqr: LQR funnel around the demos; ilqr: iLQR around the policy rollout; sample: noisy rollouts, keep the best
    lqr_r: 10.0  # tvlqr: action cost R = lqr_r I (state cost Q = diag(1 / std(s)^2))
    lqr_batch: 2000  # tvlqr: batch of the one-step simulator for the finite-difference Jacobians
    # ilqr: corrections around the policy's own K-step rollout (FD Jacobians along it, demo-tracking cost,
    # trust region ilqr_r ||u - pi(x)||^2, terminal weight ilqr_qf, line search over ilqr_alphas)
    ilqr_r: 1.0
    ilqr_qf: 1.0
    ilqr_iters: 1
    ilqr_jacobian: fd  # fd (gradient-free) or autodiff (exact Jacobians through the simulator; diagnostic)
    ilqr_stage: 1.0  # weight of the intermediate states (0 = terminal only, best phase offset among phase_offsets)
    ilqr_alphas: [1.0, 0.5, 0.25]
    # sample: sample_n noisy closed-loop rollouts around the anchored references (noise sample_noise),
    # sample_iters rounds re-centred on the best one; keep the best rejoin (forward steps only)
    sample_n: 8
    sample_noise: 0.3
    sample_iters: 1
    sample_mode: best  # best: re-sample around the best sequence; cem: around the mean of the best quarter
    sample_u0_iters: 0  # > 0: then refine the first action alone (rest of the plan fixed)
    sample_u0_noise: 0.2
    # TUTOR teachers without simulator gradients (mentor_gf.py; kind fdadam | lmplan | mppi; forward steps only).
    # fdadam: Adam (lr, iters as rejoin) on a forward-difference plan gradient (fd_mode full: every plan coordinate;
    # rand: fd_dirs random directions); lmplan: Levenberg-Marquardt on the plan (lm_jacobian fd | broyden, iters);
    # mppi: softmin-weighted mean of sample_n perturbations of radius sample_noise (iters), mppi_pull on u_0
    fd_mode: full
    fd_h: 0.01
    fd_dirs: 16
    lm_jacobian: fd
    lm_lambda: 0.01
    mppi_temp: 0.1
    mppi_pull: 0.0
    mppi_antithetic: True
    # hindsight (REQUESTS R5a): sample_n noisy plans of radius sample_noise around the references, plan = regression
    # read at zero end error (hs_form reverse: noise on [1, e]; forward: e on [1, noise], then a damped LS step)
    hs_form: reverse
    hs_ridge: 0.01
    hs_passes: 1
    # firstact (REQUESTS R6): first action by the Stage I solver (iters), continuation fa_cont (policy | refs)
    fa_cont: policy
    fa_jacobian: fd
    # sample_shared (REQUESTS R4): the sample teacher with one noise draw shared by all states (batch | run), AR(1) corr
    sample_shared: batch
    sample_corr: 0.0
    # rejoin_diag (DIAGNOSTIC, uses gradients; REQUESTS R3): label = warm + diag_shrink (adam - warm) + diag_noise N(0, I)
    diag_shrink: 1.0
    diag_noise: 0.0
    gf_chunk: 16  # plans per state rolled out together (wide simulator of batch x gf_chunk states)
    gf_seed: ${...seed}  # generator of the sampled directions (the run seed)
    plan_labels: 1  # rejoin: also add (x_k, u_k) for the first plan_labels - 1 later steps of each plan
    horizon: 8
    num_windows: 3
    screen: True  # rank windows by warm-start cost, optimise only the best one
    iters: 20  # Adam iterations (maximum when adaptive_tol > 0)
    adaptive_tol: 0.0  # > 0: stop once the mean cost improved by < adaptive_tol (relative) over adaptive_patience its
    adaptive_patience: 2
    adaptive_min: 2
    lr: 0.2
    action_reg: 0.05
    phase_offsets: [-2, -1, 0, 1, 2, 3, 4, 5, 6]
    rejoin_alpha: 1.0  # < 1: partial rejoin, target s_{j+K} + (1 - alpha) (x - s_j) (follow the demo's motion from x)
    support_barrier: 0.0  # > 0: penalise planned states outside the demos' per-coordinate range
    support_margin: 0.5  # widen that range by this many demo standard deviations
    anchor_mix: 0.0  # > 0: regularise plans towards the policy's closed-loop actions (1 = policy only, 0 = demo only)
    effort_weight: 0.0  # > 0: penalise planned effort (effort_kind activation: sum (a+1)/2; l2: sum a^2)
    effort_kind: activation
    smooth_weight: 0.0  # > 0: penalise sum_k ||u_k - u_{k-1}||^2 within the plan
    ignore_dims: ""  # observation coordinates the teacher ignores (window matching and cost), e.g. "45-52"
    match_dims: ""  # goal-matched mentor: goal coordinates ('a-b' = a..b-1, e.g. "3-6"); windows only from demos with the learner's goal
    match_tol: 1e-4
    batch: 340
    batches_per_round: 6
    select: random  # learner states to label: random | far (farthest first) | curriculum (closest fraction, widening)
    select_start: 0.3  # curriculum: fraction of the closest visited states in round 1
    select_rounds: 6  # curriculum: round at which the fraction reaches 1 (all visited states)

  # keep a label if its rejoin cost <= max(tau, cost quantile); quantile 0 = fixed tau
  gate:
    tau: 1.0
    quantile: 0.0
    # automatic gate (auto_noise > 0): tau = auto_factor x median teacher cost on states reached by auto_steps
    # noisy (auto_noise) replays of the demo actions, measured once before DAgger; overrides tau and quantile
    auto_noise: 0.0
    auto_steps: 4
    auto_factor: 2.0
    auto_batches: 3
    # advantage gate (> 0): keep a label only if the teacher's K-step plan ends closer to the demo than the policy
    # run closed loop for K steps from the same state (teacher error <= advantage x policy error); scale-free
    advantage: 0.0

  # learner rollouts per round (envs keep running across rounds; auto-reset on falls)
  rollout:
    length: 50
    noise: 0.05
    reset_every: 0  # >0: reset the first reset_fraction of the envs every this many steps
    reset_fraction: 1.0

  # extra teacher labels per round on demo states plus noise (DART-style coverage near the demos)
  augment:
    perturb_batches: 0  # number of teacher batches of perturbed demo states per round
    perturb_scale: 0.1  # noise, in demo standard deviations per coordinate
    replay_batches: 0  # teacher batches per round of states reached by noisy replays of the demo actions
    replay_steps: 4  # replay 1..replay_steps simulator steps
    replay_noise: 0.2  # action noise during the replay

  # library bootstrapping: learner segments that stay up and close to the demos join the teacher's library
  bootstrap:
    enabled: False
    tau: 0.1  # accept a segment if its labelled states' rejoin-cost quantile is <= tau
    quantile: 0.8  # 1.0 = the worst labelled state of the segment
    min_labelled: 8
    max_new: 8  # segments added per round
    max_extra: 64  # library cap beyond the original demos (oldest dropped first)
    teacher_steps: 0  # > 0: before DAgger, roll out the closed-loop teacher this many steps on num_actors envs
    teacher_tau: 1.0  # accept a teacher trajectory that never falls and has rejoin-cost quantile <= teacher_tau

  # muscle synergies (dims > 0): after Stage I, PCA of the recovered actions; teacher and policy act in a
  # dims-dimensional synergy space decoded to the env's actions (for over-actuated bodies such as SNU)
  synergies:
    dims: 0

  # Stage III: regression on the aggregated labels
  fit:
    init_steps: 6000
    init_lr: 1e-3
    steps: 3000
    lr: 5e-4
    lr_min: 1e-5
    batch_size: 1024
    loss: action  # action: ||pi(s) - a*||^2; effect: ||W J (pi(s) - a*)||^2 through the simulator Jacobian (over-actuated bodies)
    action_weight: 1e-3  # small action term added to the effect loss (null space)
    # label weights (action loss): plan labels k steps along a teacher plan weigh plan_decay^k; offpolicy_sigma > 0
    # also down-weights every row not at a visited state by exp(-d^2 / 2 sigma^2), d = distance to the current
    # policy's visited states (state-spread units per sqrt(dim))
    plan_decay: 1.0
    offpolicy_sigma: 0.0
