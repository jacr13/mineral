# MENTOR: Mimicking Expert states by iNverting the simulaTOR (state-only imitation, DFlex).
# Defaults are the Hopper recipe; tasks/mentor/*.yaml set the Ant / Humanoid ones.
seed: ${..seed}
algo: MENTOR

print_every: 1
ckpt_every: 1  # in DAgger rounds

network:
  normalize_input: False  # the policy standardises inputs with the demo statistics
  units: [256, 256]
  squash: tanh  # tanh, or clip: linear output in training, clipped to [-1, 1] when acting

mentor:
  num_actors: ${...task.env.numEnvs}
  rounds: 10
  # Rewarped tasks only (full-state MENTOR): observation keys ('name', 'name:a:b' slices) and the Stage I rule
  # (joint_velocity: actions read off joint displacements; invert: Levenberg-Marquardt through the simulator)
  obs_keys: "joint_q|com_q"
  stage1: joint_velocity
  eval_episodes_per_env: 2  # as SHAC/FOCUS eval: num_actors * 2 episodes

  demos:
    path: ""
    n_trajs: 8
    subsample_factor: 1

  # Stage I: Levenberg-Marquardt action inversion of every demo transition
  invert:
    batch: 2000
    iters: 5
    starts: 1
    param: box  # box: clip each step to [-1, 1]; tanh: optimise u with a = tanh(u) (many actions at a bound)
    reg: 0.0  # > 0 picks a minimum-norm solution for over-actuated bodies (SNU)
    reg_kind: l2  # l2: reg ||a||^2 (favours half-activated muscles); activation: reg * sum (a+1)/2 (total activation)
    jacobian: fd  # fd: finite differences every iteration; broyden: once per start, then rank-1 updates
    refresh: 0  # broyden only: recompute the finite-difference Jacobian every this many iterations (0 = never)
    audit_true_actions: False  # AUDIT ONLY: use the stored expert actions instead of the recovered ones (not state-only)

  # Stage II: rejoin teacher
  teacher:
    horizon: 8
    num_windows: 3
    screen: True  # rank windows by warm-start cost, optimise only the best one
    iters: 20
    lr: 0.2
    action_reg: 0.05
    phase_offsets: [-2, -1, 0, 1, 2, 3, 4, 5, 6]
    support_barrier: 0.0  # > 0: penalise planned states outside the demos' per-coordinate range
    support_margin: 0.5  # widen that range by this many demo standard deviations
    anchor_mix: 0.0  # > 0: regularise plans towards the policy's closed-loop actions (1 = policy only, 0 = demo only)
    effort_weight: 0.0  # > 0: penalise planned effort (effort_kind activation: sum (a+1)/2; l2: sum a^2)
    effort_kind: activation
    smooth_weight: 0.0  # > 0: penalise sum_k ||u_k - u_{k-1}||^2 within the plan
    ignore_dims: ""  # observation coordinates the teacher ignores (window matching and cost), e.g. "45:52"
    batch: 340
    batches_per_round: 6

  # keep a label if its rejoin cost <= max(tau, cost quantile); quantile 0 = fixed tau
  gate:
    tau: 1.0
    quantile: 0.0
    # automatic gate (auto_noise > 0): tau = auto_factor x median teacher cost on states reached by auto_steps
    # noisy (auto_noise) replays of the demo actions, measured once before DAgger; overrides tau and quantile
    auto_noise: 0.0
    auto_steps: 4
    auto_factor: 2.0
    auto_batches: 3
    # advantage gate (> 0): keep a label only if the teacher's K-step plan ends closer to the demo than the policy
    # run closed loop for K steps from the same state (teacher error <= advantage x policy error); scale-free
    advantage: 0.0

  # learner rollouts per round (envs keep running across rounds; auto-reset on falls)
  rollout:
    length: 50
    noise: 0.05
    reset_every: 0  # >0: reset the first reset_fraction of the envs every this many steps
    reset_fraction: 1.0

  # extra teacher labels per round on demo states plus noise (DART-style coverage near the demos)
  augment:
    perturb_batches: 0  # number of teacher batches of perturbed demo states per round
    perturb_scale: 0.1  # noise, in demo standard deviations per coordinate
    replay_batches: 0  # teacher batches per round of states reached by noisy replays of the demo actions
    replay_steps: 4  # replay 1..replay_steps simulator steps
    replay_noise: 0.2  # action noise during the replay

  # library bootstrapping: learner segments that stay up and close to the demos join the teacher's library
  bootstrap:
    enabled: False
    tau: 0.1  # accept a segment if its labelled states' rejoin-cost quantile is <= tau
    quantile: 0.8  # 1.0 = the worst labelled state of the segment
    min_labelled: 8
    max_new: 8  # segments added per round
    max_extra: 64  # library cap beyond the original demos (oldest dropped first)
    teacher_steps: 0  # > 0: before DAgger, roll out the closed-loop teacher this many steps on num_actors envs
    teacher_tau: 1.0  # accept a teacher trajectory that never falls and has rejoin-cost quantile <= teacher_tau

  # muscle synergies (dims > 0): after Stage I, PCA of the recovered actions; teacher and policy act in a
  # dims-dimensional synergy space decoded to the env's actions (for over-actuated bodies such as SNU)
  synergies:
    dims: 0

  # Stage III: regression on the aggregated labels
  fit:
    init_steps: 6000
    init_lr: 1e-3
    steps: 3000
    lr: 5e-4
    lr_min: 1e-5
    batch_size: 1024
    loss: action  # action: ||pi(s) - a*||^2; effect: ||W J (pi(s) - a*)||^2 through the simulator Jacobian (over-actuated bodies)
    action_weight: 1e-3  # small action term added to the effect loss (null space)
