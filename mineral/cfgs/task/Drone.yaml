# Warp quadrotor goal reaching (mineral/envs/drone.py): fly from a random start to a random target and hold it.
suite: drone
name: Drone

env:
  numEnvs: ${resolve_default:64,${...num_envs}}
  env_name: drone
  no_grad: True
  obs_frame: relative  # relative | absolute (goal-matching test: [position, target, R, v, w])
  targets: null  # finite target set [[x, y, z], ...] (null: uniform in target_range)
  target_ids: null  # indices of targets the resets sample from
env_autoresets: True
