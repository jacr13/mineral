# Batches of the FOCUS rerun. One batch = every arm and its control, launched together from one commit.
# Arms are defined in make_task_files.py (the clean default plus at most one changed setting).
# launch.py <batch> generates the task files, enqueues the runs and writes results/data/manifest.tsv.
p0screen:
  seeds: tuning
  tasks: [hopper, ant, humanoid, snu_humanoid]
  arms: [ref_otcos, default, noalign, cost_l2, dtw]
  skip: {hopper: [noalign, cost_l2, dtw]}
  control: ref_otcos

# Phase 2 dry run: one task, two tuning seeds, every arm of phase 3, end to end to a table and a figure.
p2dry:
  seeds: tuning
  n_seeds: 2
  tasks: [hopper]
  arms: [default, noalign, dtw, uot_expert_rho0.3, bl_gaifo_gp1, bl_maad_gp1, bl_dac, bl_opolo, bl_pwil_b2, bl_lwail,
         bl_oops_it1000, bl_ild_paper, bl_diffmimic, bl_bco, bl_gail_gp1, bl_bc]

# Screening round 2 (item 3): the -c term makes the reward negative for large costs; with the unbounded L2 cost the
# agent learns to end episodes (p0screen ant cost_l2: 0.003, 20-step episodes). Control = default of round 1.
p0screen2:
  seeds: tuning
  tasks: [hopper, ant, humanoid, snu_humanoid]
  arms: [default, no_minus_c, no_minus_c_cost_l2]
  skip: {hopper: [no_minus_c_cost_l2]}
  control: default

# Screening round 3: on Humanoid the clean default (0.53) is below the paper's OT-Cos configuration (0.89). The two
# changes other than -c, each against the default without -c (control), on the humanoids.
p0screen3:
  seeds: tuning
  tasks: [humanoid, snu_humanoid]
  arms: [no_minus_c, no_minus_c_legacy_units, no_minus_c_abs_softmin]
  control: no_minus_c

# Screening round 4: p0screen (9c295f3) reset the training envs at every periodic evaluation, which depressed
# training (same default arm, same seeds: Humanoid 0.741 there, 0.975 in p0screen2). Clean comparison of the
# candidate default (no -c) with the paper's OT-Cos configuration, same batch, shared evaluation on its own env.
p0screen4:
  seeds: tuning
  tasks: [hopper, ant, humanoid, snu_humanoid]
  arms: [ref_otcos, no_minus_c]
  control: ref_otcos

# Round 5 (Joao, 2026-11-20): the final default (no -c) against state pairs, and 1 / 2 demonstrations.
p0screen5:
  seeds: tuning
  tasks: [hopper, ant, humanoid, snu_humanoid]
  arms: [f_default, f_statepairs, f_demos1, f_demos2]
  control: f_default

# Baseline tuning on the tuning seeds (Joao, 2026-11-20): the one knob per method of the shared protocol, plus ILD's
# four variants (paper mode with truncation 10 / 32; the 32-step window variant on SAPO / SHAC). Best per task is
# chosen here and used, unchanged, in Phase 3.
p1tune:
  seeds: tuning
  tasks: [hopper, ant, humanoid, snu_humanoid]
  arms: [bl_gaifo_gp1, bl_gaifo_gp10, bl_maad_gp1, bl_maad_gp10, bl_gail_gp1, bl_gail_gp10, bl_pwil_b2, bl_pwil_b5,
         bl_ild_paper, bl_ild_paper_t32, bl_ild_win_sapo, bl_ild_win_shac]

# Round 6: SAPO's entropy terms in FOCUS (found 2026-11-20): every earlier run had no entropy in the actor, alpha
# fixed at 1 and, through SHAC's entropy path with an unfilled buffer, a constant +0.5 bonus in the critic targets.
# legacy (= f_default) against none (no entropy, no bonus) and sapo (SAPO's maximum-entropy objective).
p0screen6:
  seeds: tuning
  tasks: [hopper, ant, humanoid, snu_humanoid]
  arms: [f_default, f_ent_none, f_ent_sapo]
  control: f_default

# Round 7 (Joao, 2026-11-21): which backbone. SAPO-style networks without entropy, SAPO's maximum-entropy objective,
# and the SHAC-style backbone (critic targets fixed in 91a1a9d), with 6 tuning seeds so a per-task choice is not made
# on noise. Control: f_ent_none.
p0screen7:
  seeds: tuning6
  tasks: [hopper, ant, humanoid, snu_humanoid]
  arms: [f_ent_none, f_ent_sapo, f_shac]
  control: f_ent_none

# Round 8 (Joao, 2026-11-21): rho of the expert-side unbalanced OT for the main table, on the no-entropy backbone.
p0screen8:
  seeds: tuning
  tasks: [hopper, ant, humanoid, snu_humanoid]
  arms: [f_ent_none, fn_uot_expert_rho0.1, fn_uot_expert_rho0.3, fn_uot_expert_rho1]
  control: f_ent_none

# Round 8 corrected (2026-11-21): p0screen8's fn_uot arms ran with -c (DEFAULT base), their control without, so that
# round is confounded. Same arms on the clean FINAL config; control in the same batch.
p0screen8b:
  seeds: tuning
  tasks: [hopper, ant, humanoid, snu_humanoid]
  arms: [f_ent_none, f_n_uot_rho0.1, f_n_uot_rho0.3, f_n_uot_rho1]
  control: f_ent_none

# PHASE 3, main comparison (Joao, 2026-11-21): reported seeds, one code commit for every arm. The RTX 3090 pin was
# removed the same day (none free); timings come from a separate RTX 3090 batch (~10 epochs per method, extrapolated).
# Baselines first at low priority; the FOCUS variants are added to the same batch (same commit, --commit) once rounds
# 7 and 8 have fixed the backbone and rho.
p3main:
  seeds: reported
  tasks: [hopper, ant, humanoid, snu_humanoid, cheetah, cartpoleswingup]
  # HalfCheetah (2026-11-22) and CartPole (2026-11-23): main FOCUS arms and baselines only; ablations stay on the four
  # original tasks
  skip:
    cheetah: [f_ab_demos16, bl_lwail__d1, bl_opolo__d1, bl_ild_tuned__d1, bl_lwail__d16, bl_opolo__d16, bl_ild_tuned__d16, f_ab_eps0.03, f_ab_eps0.3, f_ab_eps1, f_ab_iters20, f_ab_iters200, f_ab_eps0.03_iters200, f_ab_through_sinkhorn, f_ab_score_function, f_ab_score_function_lr2e-4, f_ab_uot_rho0.3, f_ab_uot_rho1, f_ab_uot_rho3, f_ab_uot_rho10, f_ab_uot_rho100, f_ab_dtw_subseq, f_ab_k1, f_ab_k2, f_ab_k4, f_ab_k16, f_ab_noalign_k1, f_ab_minus_c, f_ab_rew_neg, f_ab_rew_exp, f_ab_critic_off, f_ab_shac, f_ab_ent_sapo, f_ab_demos1, f_ab_demos2, f_ab_demos4, f_ab_statepairs, f_ab_cost_l2, f_ab_feat64, f_ab_kmin, f_ab_kmean, f_main_ot__n0.1, bl_lwail__n0.1, bl_ild_tuned__n0.1, bl_opolo__n0.1, f_main_ot__n0.3, bl_lwail__n0.3, bl_ild_tuned__n0.3, bl_opolo__n0.3, f_main_ot__n0.6, bl_lwail__n0.6, bl_ild_tuned__n0.6, bl_opolo__n0.6, f_main_ot__n1, bl_lwail__n1, bl_ild_tuned__n1, bl_opolo__n1, f_fix_ot__anneal, bl_ild_tuned__anneal]
    cartpoleswingup: [f_ab_demos16, bl_lwail__d1, bl_opolo__d1, bl_ild_tuned__d1, bl_lwail__d16, bl_opolo__d16, bl_ild_tuned__d16, f_ab_eps0.03, f_ab_eps0.3, f_ab_eps1, f_ab_iters20, f_ab_iters200, f_ab_eps0.03_iters200, f_ab_through_sinkhorn, f_ab_score_function, f_ab_score_function_lr2e-4, f_ab_uot_rho0.3, f_ab_uot_rho1, f_ab_uot_rho3, f_ab_uot_rho10, f_ab_uot_rho100, f_ab_dtw_subseq, f_ab_k1, f_ab_k2, f_ab_k4, f_ab_k16, f_ab_noalign_k1, f_ab_minus_c, f_ab_rew_neg, f_ab_rew_exp, f_ab_critic_off, f_ab_shac, f_ab_ent_sapo, f_ab_demos1, f_ab_demos2, f_ab_demos4, f_ab_statepairs, f_ab_cost_l2, f_ab_feat64, f_ab_kmin, f_ab_kmean, f_main_ot__n0.1, bl_lwail__n0.1, bl_ild_tuned__n0.1, bl_opolo__n0.1, f_main_ot__n0.3, bl_lwail__n0.3, bl_ild_tuned__n0.3, bl_opolo__n0.3, f_main_ot__n0.6, bl_lwail__n0.6, bl_ild_tuned__n0.6, bl_opolo__n0.6, f_main_ot__n1, bl_lwail__n1, bl_ild_tuned__n1, bl_opolo__n1, f_fix_ot__anneal, bl_ild_tuned__anneal]
    # SNU: sigma 0.3 / 0.6 / 1.0 only (R24, Joao 2026-11-26)
    snu_humanoid: [f_main_ot__n0.1, bl_lwail__n0.1, bl_ild_tuned__n0.1, bl_opolo__n0.1]
  arms: [bl_gaifo_tuned, bl_maad_tuned, bl_dac, bl_opolo, bl_pwil_tuned, bl_lwail, bl_oops_tuned, bl_ild_tuned,
         bl_diffmimic, bl_bco, bl_gail_tuned, bl_bc,
         f_main_ot, f_main_dtw, f_main_noalign,
         # Phase 4 ablations, control f_main_ot (same batch, same commit, same seeds): one setting changed each
         f_ab_through_sinkhorn, f_ab_score_function, f_ab_score_function_lr2e-4,
         f_ab_uot_rho0.3, f_ab_uot_rho1, f_ab_uot_rho3, f_ab_uot_rho10, f_ab_uot_rho100, f_ab_dtw_subseq,
         f_ab_k1, f_ab_k2, f_ab_k4, f_ab_k16, f_ab_noalign_k1,
         f_ab_minus_c, f_ab_rew_neg, f_ab_rew_exp, f_ab_critic_off, f_ab_shac, f_ab_ent_sapo,
         f_ab_demos1, f_ab_demos2, f_ab_demos4, f_ab_statepairs, f_ab_cost_l2, f_ab_feat64,
         # best-of-K selection: hard min / plain average (2026-11-23)
         f_ab_kmin, f_ab_kmean,
         # Sinkhorn entropy / iterations (2026-11-25): Hopper, Ant, Humanoid, SNU
         f_ab_eps0.03, f_ab_eps0.3, f_ab_eps1, f_ab_iters20, f_ab_iters200, f_ab_eps0.03_iters200,
         # noisy demonstrations, sigma 0.1 / 0.3 of the per-dimension std (2026-11-23): Hopper, Ant, Humanoid
         f_main_ot__n0.1, bl_lwail__n0.1, bl_ild_tuned__n0.1, bl_opolo__n0.1,
         f_main_ot__n0.3, bl_lwail__n0.3, bl_ild_tuned__n0.3, bl_opolo__n0.3,
         # actor bootstrap fixed (R19, Joao 2026-11-25): paired check against f_main_ot, six tasks
         f_fix_ot,
         # few-demonstration study (R16, Joao 2026-11-25: minimal set, without DAC): Hopper, Ant, Humanoid, SNU
         f_ab_demos16, bl_lwail__d1, bl_opolo__d1, bl_ild_tuned__d1, bl_lwail__d16, bl_opolo__d16, bl_ild_tuned__d16,
         # larger noise (R24, Joao 2026-11-26): sigma 0.6 / 1.0 on Hopper, Ant, Humanoid; SNU 0.3 / 0.6 / 1.0. The FOCUS
         # arms wait for the R19 decision (f_main_ot or the fixed bootstrap)
         f_main_ot__n0.6, bl_lwail__n0.6, bl_ild_tuned__n0.6, bl_opolo__n0.6, f_main_ot__n1, bl_lwail__n1, bl_ild_tuned__n1, bl_opolo__n1,
         # learning rate annealed over the run (Joao 2026-11-26, late collapses): Hopper, paired with f_fix_ot and
         # bl_ild_tuned
         f_fix_ot__anneal, bl_ild_tuned__anneal]

# Light tuning of the score-function arm (Phase 4 item 1: the weaker arm gets light tuning): actor lr, tuning seeds.
p4sftune:
  seeds: tuning
  tasks: [hopper, ant, humanoid, snu_humanoid]
  arms: [f_sf_lr0.002, f_sf_lr0.0006, f_sf_lr0.0002,
         # extension (2026-11-22): the best rate of the first grid was its smallest
         f_sf_lr6e-05, f_sf_lr2e-05]

# Timing (Joao, 2026-11-21): every Phase 3 method on RTX 3090 for 5 % of its budget (make_task_files.BUDGET_SCALE);
# full-run time = 3090 time per step x the method's own time profile over the full runs (REPORT, extrapolation).
p3time:
  seeds: reported
  n_seeds: 1
  tasks: [hopper, ant, humanoid, snu_humanoid, cheetah, cartpoleswingup]
  arms: [bl_gaifo_tuned, bl_maad_tuned, bl_dac, bl_opolo, bl_pwil_tuned, bl_lwail, bl_oops_tuned, bl_ild_tuned,
         bl_diffmimic, bl_bco, bl_gail_tuned, bl_bc, f_main_ot, f_main_dtw, f_main_noalign]

# Phase 4 item 4 (2026-11-21): zeroth-order FOCUS. New code commit (one loss builder for FOCUS, FOCUS-PPO and
# FOCUS-SAC), so the batch has its own control f_main_ot at that commit.
p4zo:
  seeds: reported
  tasks: [hopper, ant, humanoid, snu_humanoid, cheetah, cartpoleswingup]
  arms: [f_main_ot, f_zo_ppo, f_zo_sac]

# Phase 5, ordering task (2026-11-22): Rewarped soft Jumper. Brief: first show that no alignment and K = 1 do worse
# there; if they do not, the task does not answer the reviewers. Tuning seeds; reported seeds only if it does.
p5jumper:
  seeds: tuning
  tasks: [jumper]
  arms: [f_main_ot, f_main_noalign, f_ab_k1, f_ab_noalign_k1, f_main_dtw]

# Phase 5 ordering test, option b (Joao, 2026-11-22): imitation cost on positions only, so that order is the only cue
# for the direction of motion. Screen on tuning seeds; HalfCheetah joins once its demonstrations exist.
p5order:
  seeds: tuning
  tasks: [hopper, ant, cheetah]
  arms: [f_main_ot, f_pos_ot, f_pos_dtw, f_pos_noalign, f_pos_k1]

# HalfCheetah (Joao, 2026-11-22: the other SHAC-paper tasks). Baseline tuning as p1tune (same variants, tuning
# seeds) plus a FOCUS-OT sanity arm; then HalfCheetah joins p3main with the variants chosen here.
p1tune_cheetah:
  seeds: tuning
  tasks: [cheetah]
  arms: [bl_gaifo_gp1, bl_gaifo_gp10, bl_maad_gp1, bl_maad_gp10, bl_gail_gp1, bl_gail_gp10, bl_pwil_b2, bl_pwil_b5,
         bl_ild_paper, bl_ild_paper_t32, bl_ild_win_sapo, bl_ild_win_shac, f_main_ot]

# CartPole Swing-Up (Joao, 2026-11-23; scored random-referenced): baseline tuning as p1tune + FOCUS-OT sanity arm.
p1tune_cartpole:
  seeds: tuning
  tasks: [cartpoleswingup]
  arms: [bl_gaifo_gp1, bl_gaifo_gp10, bl_maad_gp1, bl_maad_gp10, bl_gail_gp1, bl_gail_gp10, bl_pwil_b2, bl_pwil_b5,
         bl_ild_paper, bl_ild_paper_t32, bl_ild_win_sapo, bl_ild_win_shac, f_main_ot]
