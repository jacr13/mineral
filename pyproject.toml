[project]
name = "mineral"
version = "0.1.0"
authors = [{ name = "etaoxing", email = "etaoxing@users.noreply.github.com" }]
description = "A minimal(ish) reinforcement learning library that aggregates reliable implementations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "atalaya>=0.3.3,<0.4.0",
    "chex>=0.1.92,<0.2.0",
    "dflex",
    "gym==0.23.1",
    "hydra-colorlog>=1.2.0,<2.0.0",
    "hydra-core>=1.3.2,<2.0.0",
    "jax[cuda12]>=0.11,<0.12; sys_platform == 'linux'",
    "jax>=0.11,<0.12; sys_platform == 'darwin'",
    "matplotlib>=3.10.8,<4.0.0",
    "mujoco-mjx>=3.14,<4.0.0",
    "pandas>=2.3.3,<3.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
    "rewarped==1.3.3",
    "scipy==1.15.3",
    "tabulate>=0.9.0,<0.10.0",
    "tensorboard>=2.20.0,<3.0.0",
    "termcolor>=3.1.0,<4.0.0",
    "torch>=2.8.0,<2.9.0; sys_platform == 'darwin' or sys_platform == 'linux'",
    "torch-jax-interop>=0.0.8,<0.0.9",
    "urchin>=0.0.29,<0.0.30",
    "usd-core>=26.8,<27.0",
    # Rewarped 1.3.3 with its Warp: AllegroHand goes NaN with Rewarped main + Warp 1.7-1.9 (half the envs, first step).
    "warp-lang==1.3.3",
    "wandb>=0.22.2,<0.23.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.25.1,<0.26.0",
    "ruff>=0.3.7,<0.4.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mineral*"]

[tool.setuptools.package-data]
mineral = ["cfgs/**/*.yaml"]

[tool.uv]
# Run source from the checkout, as with the previous --no-root installs.
package = false
# Rewarped 1.3.3 pins usd-core==24.5, which has no Python 3.12 wheels; it only uses USD for optional rendering.
override-dependencies = ["usd-core>=26.8,<27.0"]

[tool.uv.sources]
dflex = { git = "https://github.com/jacr13/DiffRL.git", branch = "main" }
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 127
indent-width = 4
extend-exclude = [
    ".git",
    ".vscode",
    "__pycache__",
    "docs",
    "build",
    "third_party",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "I",  # isort
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",  # pydocstyle
]
ignore = [
    "B008",  # Do not perform calls in argument defaults.
    "D10",   # Missing docstring
    "E203",  # Whitespace before ':' (breaks black)
    "E266",  # Too many leading '#' for block comment
    "E302",  # Expected 2 blank lines, found 0
    "E501",  # Line too long
    "E722",  # do not use bare 'except'
    "E731",  # Do not assign a lambda expression, use a def
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",  # Module imported but unused
    "E402",  # Module level import not at top of file
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.poe.executor]
type = "simple"

[tool.poe.tasks]  # https://github.com/nat-n/poethepoet

# install
install = "uv sync"
install_nodev = "uv sync --no-dev"

# format
ruff_check = "uv run --locked ruff check --fix ."
ruff_fmt = "uv run --locked ruff format ."
ruff_fix_unsafe = "uv run --locked ruff check --fix --unsafe-fixes ."
format = ["ruff_check", "ruff_fmt"]

# delete venv and lock
_delete_venv = { shell = 'rm -rf -- "${UV_PROJECT_ENVIRONMENT:-.venv}"' }
_delete_lock = "rm -f uv.lock"
delete = ["_delete_lock", "_delete_venv"]

# Reinstall the locked dependencies without changing their versions.
reinstall = "uv sync --locked --reinstall"

# cleaning
clean = """
rm -rf .coverage
        htmlcov
        coverage.xml
        .mypy_cache
        .ruff_cache
        .pytest_cache
        ./**/__pycache__
        dist
        logs
"""

# docker
# --build-arg USER_ID=$(id -u) --build-arg GROUP_ID=$(id -g)
docker_build = "docker build --build-arg USER_ID=1000 --build-arg GROUP_ID=1000 -t candidj0/mineral:latest ."

docker_push = "docker push candidj0/mineral:latest"
dbp = ["docker_build", "docker_push"]

docker = """
docker run \
    --gpus=all \
    --rm \
    --env-file .env \
    -it \
    -u 1000:1000 \
    -v /etc/timezone:/etc/timezone:ro \
    -v /etc/localtime:/etc/localtime:ro \
    -v .:/workspace \
    candidj0/mineral:latest bash
"""

docker_win = """
docker run \
    --gpus=all \
    --rm \
    --env-file .env \
    -it \
    -u 1000:1000 \
    -v .:/workspace \
    candidj0/mineral:latest bash
"""

docker_win_su = """
docker run \
    --gpus=all \
    --rm \
    --env-file .env \
    -it \
    -v .:/workspace \
    candidj0/mineral:latest bash
"""
