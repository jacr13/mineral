# Generated by scripts/focus/make_task_files.py (p5jumper, arm f_ab_noalign_k1); do not edit.
# Settings are in the body, not in the sweep block (--set seed replaces the sweep block).
task:
  name: Rewarped
  env: {env_name: Jumper, env_suite: gradsim}
agent:
  name: FOCUS/RewarpedJumperSAPO
  ckpt_every: -1
  protocol_eval: true
  eval_every_steps: 500000
  save_eval_rollouts: false
  shac:
    max_epochs: 50000
    max_agent_steps: 6200000
    critic_optim_kwargs: {lr: 0.0005}
    target_critic_alpha: 0.995
  focus:
    demos: {path: experts/demos/Rewarped_Jumper_demos64_return2046_len300.pt, n_trajs: 8}
    imitation_loss_type: index
    input_type: state
    loss_mlp_features_dim: null
    loss_ot_cost_type: cosine
    loss_cost_units: expected
    loss_best_of_k_k: 1
    loss_best_of_k_relative: true
    loss_best_of_k_tau: 0.1
    loss_ot_eps: 0.1
    loss_ot_iters: 60
    loss_ot_detach_plan: true
    loss_ot_marginal_rho: null
    loss_ot_marginal_side: both
    critic_reward_mapping: log_exp
    critic_reward_minus_cost: false
    critic_reward_shapping: true
    critic_disabled: false
    critic_reward_normalize: false
    loss_use_huber_speedup: false
    loss_use_detached_prev_obs: false
    actor_grad_estimator: pathwise
    backbone_entropy: none
  network:
    encoder_kwargs: {mlp_keys: com_q|com_qd|actions}
    actor_kwargs:
      mlp_kwargs:
        units: [512, 256]
    critic_kwargs:
      mlp_kwargs:
        units: [256, 256]
num_envs: 32
logdir: workdir/focus-p5jumper-jumper-f_ab_noalign_k1/$(date +%Y%m%d-%H%M%S.%2N)
wandb: {mode: offline}
run: train_eval
seed: 10
sweep:
  seed: [10, 20, 30]
spawner: {runtime: 12h}
