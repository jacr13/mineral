# Generated by scripts/focus/make_task_files.py (p4zo, arm f_zo_ppo); do not edit.
# Settings are in the body, not in the sweep block (--set seed replaces the sweep block).
task:
  name: DFlex
  env: {env_name: ant}
agent:
  name: FOCUS/DFlexAntPPO
  ckpt_every: -1
  protocol_eval: true
  eval_every_steps: 500000
  ppo: {max_agent_steps: 10000000}
  focus:
    demos: {path: experts/demos/DFlex_ant_demos128_return9318_len1000.pt, n_trajs: 8}
    imitation_loss_type: ot
    input_type: state
    loss_mlp_features_dim: null
    loss_ot_cost_type: cosine
    loss_cost_units: expected
    loss_best_of_k_k: 8
    loss_best_of_k_relative: true
    loss_best_of_k_tau: 0.1
    loss_ot_eps: 0.1
    loss_ot_iters: 60
    loss_ot_detach_plan: true
    loss_ot_marginal_rho: null
    loss_ot_marginal_side: both
    critic_reward_mapping: log_exp
    critic_reward_minus_cost: false
    critic_reward_shapping: true
    critic_reward_normalize: false
    loss_use_huber_speedup: false
    loss_use_detached_prev_obs: false
logdir: workdir/focus-p4zo-ant-f_zo_ppo/$(date +%Y%m%d-%H%M%S.%2N)
wandb: {mode: offline}
run: train_eval
seed: 10
sweep:
  seed: [10, 20, 30]
spawner: {runtime: 12h}
