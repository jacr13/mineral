# Generated by scripts/focus/make_task_files.py (p3main, arm bl_oops_tuned); do not edit.
# Settings are in the body, not in the sweep block (--set seed replaces the sweep block).
task:
  name: DFlex
  env: {env_name: cartpoleswingup, no_grad: true, +early_termination: false}
agent:
  name: OOPS/DFlexAnt
  ddpg: {max_agent_steps: 4000000, horizon_len: 240}
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [128, 64, 32]
    critic_kwargs:
      mlp_kwargs:
        units: [64, 64]
  oops:
    demos: {path: experts/demos/DFlex_cartpoleswingup_demos128_return-286_len240.pt,
      n_trajs: 8, subsample_factor: 1}
    sinkhorn_eps: 0.05
    reward_scale: 5.0
    state_action: false
    aug_time: true
    sinkhorn_iters: 1000
  ckpt_every: -1
  protocol_eval: true
  eval_every_steps: 500000
logdir: workdir/focus-p3main-cartpoleswingup-bl_oops_tuned/$(date +%Y%m%d-%H%M%S.%2N)
wandb: {mode: offline}
run: train_eval
seed: 10
spawner: {runtime: 12h}
sweep:
  seed: [10, 20, 30]
