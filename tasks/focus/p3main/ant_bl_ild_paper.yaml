# Generated by scripts/focus/make_task_files.py (p3main, arm bl_ild_paper); do not edit.
# Settings are in the body, not in the sweep block (--set seed replaces the sweep block).
task:
  name: DFlex
  env: {env_name: ant}
agent:
  name: ILD/DFlex
  shac: {max_agent_steps: 10000000}
  ild:
    demos: {path: experts/demos/DFlex_ant_demos128_return9318_len1000.pt, n_trajs: 8}
    mode: paper
    count_all_sim_steps: true
  ckpt_every: -1
  +resume_ckpt: true
  protocol_eval: true
  eval_every_steps: 500000
  save_eval_rollouts: false
logdir: workdir/focus-p3main-ant-bl_ild_paper/$(date +%Y%m%d-%H%M%S.%2N)
run: train_eval
seed: 10
spawner: {runtime: 12h}
wandb: {mode: offline}
sweep:
  seed: [10, 20, 30]
