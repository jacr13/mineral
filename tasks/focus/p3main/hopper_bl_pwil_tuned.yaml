# Generated by scripts/focus/make_task_files.py (p3main, arm bl_pwil_tuned); do not edit.
# Settings are in the body, not in the sweep block (--set seed replaces the sweep block).
task:
  name: DFlex
  env: {env_name: hopper, no_grad: true}
agent:
  name: PWIL/DFlexAnt
  sac: {max_agent_steps: 10000000, +target_entropy_scalar: 0.5, tau: 0.005}
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [128, 64, 32]
    critic_kwargs:
      mlp_kwargs:
        units: [64, 64]
  pwil:
    demos: {path: experts/demos/DFlex_hopper_demos128_return4812_len1000.pt, n_trajs: 8,
      subsample_factor: 20}
    observation_only: true
    alpha: 5.0
    beta: 2.0
  ckpt_every: -1
  protocol_eval: true
  eval_every_steps: 500000
logdir: workdir/focus-p3main-hopper-bl_pwil_tuned/$(date +%Y%m%d-%H%M%S.%2N)
wandb: {mode: offline}
run: train_eval
seed: 10
spawner: {runtime: 12h}
sweep:
  seed: [10, 20, 30]
