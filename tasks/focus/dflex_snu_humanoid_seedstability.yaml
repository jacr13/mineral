# Seed-stability probe for FOCUS-OT-L2 on SNU Humanoid.
#
# The rebuttal's fresh fixed-coupling arm hit 2 collapses in 6 seeds (0.42, 0.34
# expert-normalized) where the reported six-seed batch had none, at an identical
# resolved configuration. Twelve further seeds, disjoint from the reported ones,
# characterize that distribution instead of leaving it as an anecdote. Combined
# with the 6 gradpath fixed-coupling seeds this gives 18 samples.
#
# Config below is the reported FOCUS-OT-L2 setup; only sweep.seed differs from
# tasks/focus/dflex_snu_humanoid.yaml.
task:
  name: DFlex
  env:
    env_name: snu_humanoid
agent:
  name: FOCUS/DFlexAntSHAC
  shac:
    max_epochs: 50000
    max_agent_steps: 15000000
    critic_optim_kwargs:
      lr: 5e-4
    target_critic_alpha: 0.995
  focus:
    demos:
      path: "experts/demos/DFlex_snu_demos128_return6246_len929.pt"
      n_trajs: 8
    loss_best_of_k_k: 8
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [512, 256]
    critic_kwargs:
      mlp_kwargs:
        units: [256, 256]
logdir: "workdir/DFlexSNUHumanoid-FOCUS-seedstability/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 120

sweep:
  logdir: "workdir/DFlexSNUHumanoid-FOCUS-seedstability/$(date +%Y%m%d-%H%M%S.%2N)"
  seed: [200, 210, 220, 230, 240, 250, 2000, 2100, 2200, 2300, 2400, 2500]
  # agent.focus.loss_best_of_k_k: [1, 2, 4, 8, 16]
  agent.focus.demos.n_trajs: 8
  agent.focus.critic_disabled: false
  agent.focus.critic_reward_shapping: true
  agent.focus.critic_reward_mapping: exp # [log_exp, exp]
  agent.focus.imitation_loss_type: ot
  agent.focus.loss_ot_cost_type: l2 # [l2, cosine]
  agent.focus.loss_use_huber_speedup: false
  agent.focus.loss_mlp_features_dim: null
  agent.focus.loss_use_detached_prev_obs: false

spawner:
  runtime: "12h"
