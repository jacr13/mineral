# Phase 0 port check (FOCUS brief item 7): the paper's l2 configuration on hopper, settings copied from the
# logged configuration of the reported runs (ICLR Reviews/audit/v2/runs.jsonl). Tuning seeds only, never reported.
task:
  name: DFlex
  env: {env_name: hopper}
agent:
  name: FOCUS/DFlexAntSAPO
  shac: {max_epochs: 50000, max_agent_steps: 10000000}
  focus:
    demos: {path: experts/demos/DFlex_hopper_demos128_return4812_len1000.pt, n_trajs: 8}
    loss_best_of_k_k: 8
    critic_disabled: false
    critic_reward_shapping: true
    critic_reward_normalize: false
    loss_use_huber_speedup: false
    loss_use_detached_prev_obs: false
    input_type: state
    imitation_loss_type: l2
    loss_ot_cost_type: l2
    critic_reward_mapping: exp
    loss_mlp_features_dim: 64
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [128, 64, 32]
    critic_kwargs:
      mlp_kwargs:
        units: [64, 64]
logdir: workdir/focus-p0port-hopper_l2/$(date +%Y%m%d-%H%M%S.%2N)
wandb: {mode: offline}
run: train_eval
seed: 10
sweep:
  seed: [10, 20, 30]
spawner: {runtime: 8h}
