task:
  name: DFlex
  env:
    env_name: hopper
    no_grad: true
agent:
  name: PWIL/DFlexAnt
  sac:
    max_agent_steps: 10000000
    +target_entropy_scalar: 0.5
    tau: 0.005
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [128, 64, 32]
    critic_kwargs:
      mlp_kwargs:
        units: [64, 64]
  pwil:
    demos:
      path: "experts/demos/DFlex_hopper_demos128_return4812_len1000.pt"
      n_trajs: 8
      subsample_factor: 20 # 0 means no subsampling, >1 means subsample by this factor
    observation_only: false
    alpha: 5.0
    beta: 5.0
logdir: "workdir/DFlexHopper10M-PWIL/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 130

sweep:
  seed: [100, 110, 120]
  agent.pwil.demos.subsample_factor: [1, 20]
  agent.pwil.alpha: [1.0, 5.0, 10.0]
  agent.pwil.beta: [1.0, 5.0, 10.0]
  agent.pwil.observation_only: [true, false]

spawner:
  runtime: "3h30m"
