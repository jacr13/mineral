task:
  name: Rewarped
  env:
    env_name: AllegroHand
    env_suite: isaacgymenvs
agent:
  name: ILD/DFlexAntSAPO
  shac:
    max_epochs: 2000
    max_agent_steps: 4100000
    critic_optim_kwargs:
      lr: 5e-4
    target_critic_alpha: 0.995
  otil:
    demos:
      path: "experts/demos/Rewarped_AllegroHand_demos128_return231_len546.pt"
      n_trajs: 8
    loss_best_of_k_k: 8
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [512, 256]
    critic_kwargs:
      mlp_kwargs:
        units: [256, 256]
logdir: "workdir/RewarpedAllegroHand4M-ILD/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 1100

sweep:
  seed: [100, 110, 120, 130, 140, 1000, 1100, 1200, 1300, 1400]
