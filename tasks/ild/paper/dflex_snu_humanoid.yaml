# ILD as in the paper (agent ILD/DFlex, mode paper), 8 demos, 64 envs, 20M env steps (312 whole-episode iterations).
task:
  name: DFlex
  env:
    env_name: snu_humanoid
    numEnvs: 64
agent:
  name: ILD/DFlex
  shac:
    max_agent_steps: 20000000
  ild:
    demos:
      path: experts/demos/DFlex_snu_demos128_return6246_len929.pt
      n_trajs: 8
    bootstrap_invert:
      param: tanh
      reg: 0.0001
      iters: 60
      batch: 1000
      refresh: 5
logdir: workdir/DFlexSNUHumanoid-ILDpaper/$(date +%Y%m%d-%H%M%S.%2N)
run: train_eval
seed: 100
sweep:
  seed: [100, 110, 120, 1000, 1100, 1200]
spawner:
  runtime: 12h
