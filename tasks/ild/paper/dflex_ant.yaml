# ILD as in the paper (agent ILD/DFlex, mode paper), 8 demos, 64 envs, 20M env steps (312 whole-episode iterations).
task:
  name: DFlex
  env:
    env_name: ant
    numEnvs: 64
agent:
  name: ILD/DFlex
  shac:
    max_agent_steps: 20000000
  ild:
    demos:
      path: experts/demos/DFlex_ant_demos128_return9318_len1000.pt
      n_trajs: 8
logdir: workdir/DFlexAnt-ILDpaper/$(date +%Y%m%d-%H%M%S.%2N)
run: train_eval
seed: 100
sweep:
  seed: [100, 110, 120, 1000, 1100, 1200]
spawner:
  runtime: 12h
