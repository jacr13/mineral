task:
  name: DFlex
  env:
    env_name: cheetah
agent:
  name: ILD/DFlexAntSAPO
  shac:
    max_epochs: 50000
    max_agent_steps: 10000000
  ild:
    demos:
      path: experts/demos/DFlex_cheetah_demos128_return8078_len1000.pt
      n_trajs: 8
  network:
    actor_kwargs:
      mlp_kwargs:
        units:
        - 128
        - 64
        - 32
    critic_kwargs:
      mlp_kwargs:
        units:
        - 64
        - 64
logdir: workdir/DFlexCheetah10M-ILD/$(date +%Y%m%d-%H%M%S.%2N)
run: train_eval
seed: 100
sweep:
  seed:
  - 100
  - 110
  - 120
  - 1000
  - 1100
  - 1200
spawner:
  runtime: 2h45m
