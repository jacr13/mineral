task:
  name: DFlex
  env:
    env_name: hopper
agent:
  name: ILD/DFlexAntSAPO
  shac:
    max_epochs: 5000
    max_agent_steps: 10000000
  ild:
    demos:
      path: "experts/demos/DFlex_hopper_demos128_return4812_len1000.pt"
      n_trajs: 8
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [128, 64, 32]
    critic_kwargs:
      mlp_kwargs:
        units: [64, 64]
logdir: "workdir/DFlexHopper10M-ILD/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 130

sweep:
  seed: [100, 110, 120]
  agent.shac.horizon_len: [5, 10, 32]
  agent.shac.horizon_len: [10, 20, 32]
  agent.name: [ILD/DFlexAntSAPO, ILD/DFlexAntSHAC, ILD/DFlexAntSHAC2]

spawner:
  runtime: "2h45m"