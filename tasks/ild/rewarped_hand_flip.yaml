task:
  name: Rewarped
  env:
    env_name: Flip
    env_suite: dexdeform
agent:
  name: ILD/RewarpedJumper
  network:
    encoder_kwargs:
      mlp_keys: com_q|joint_q
    actor_kwargs:
      mlp_kwargs:
        units:
        - 512
        - 256
    critic_kwargs:
      mlp_kwargs:
        units:
        - 256
        - 256
  shac:
    critic_optim_kwargs:
      lr: 5e-4
    target_critic_alpha: 0.995
  ild:
    demos:
      path: experts/demos/Rewarped_Flip_demos64_return83_len300.pt
      n_trajs: 8
logdir: workdir/RewarpedDexDeformFlip6M-ILD/$(date +%Y%m%d-%H%M%S.%2N)
num_envs: 32
run: train_eval
seed: 100
sweep:
  seed:
  - 100
  - 110
  - 120
  - 1000
  - 1100
  - 1200
spawner:
  runtime: 12h
