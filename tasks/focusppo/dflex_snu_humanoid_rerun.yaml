# Rerun config for the ZO-FOCUS-PPO cells that never reached the stated
# interaction budget. Identical to tasks/focusppo/dflex_snu_humanoid.yaml except spawner.runtime.
#
# The originals were capped at 7h30m and several seeds died before 15M steps;
# because plotter.py takes a method's final x as min(steps[-1]) over its seeds,
# one short seed pulled whole cells down to 55-82% of the budget while Table 13
# reports them "at the final interaction budget". spawner.py lets a config's
# own spawner.runtime override the CLI --runtime, so the cap has to be raised
# here rather than on the command line.
task:
  name: DFlex
  env:
    env_name: snu_humanoid
    no_grad: true
agent:
  name: FOCUS/DFlexAntPPO
  ppo:
    max_agent_steps: 10000000
  focus:
    demos:
      path: "experts/demos/DFlex_snu_demos128_return6246_len929.pt"
      n_trajs: 8
    input_type: state_state
    imitation_loss_type: ot
    loss_best_of_k_k: 8
    loss_ot_cost_type: l2
    loss_use_huber_speedup: false
    loss_use_detached_prev_obs: false
    loss_mlp_features_dim: 64
    critic_reward_mapping: exp
    critic_reward_shapping: false
  network:
    actor_critic_kwargs:
      mlp_kwargs:
        units: [512, 256]
      +critic_mlp_kwargs:
        units: [256, 256]
        norm_type: LayerNorm
        act_type: ELU
logdir: "workdir/DFlexSNUHumanoid10M-FOCUS_PPO/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 120

sweep:
  seed: [100, 110, 120, 1000, 1100, 1200]

spawner:
  runtime: "12h"
