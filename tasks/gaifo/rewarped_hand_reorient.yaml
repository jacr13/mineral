task:
  name: Rewarped
  env:
    env_name: AllegroHand
    env_suite: isaacgymenvs
    no_grad: true
agent:
  name: GAIfO/DFlex
  ppo:
    max_agent_steps: 4100000
  network:
    actor_critic_kwargs:
      mlp_kwargs:
        units: [512, 256]
      +critic_mlp_kwargs:
        units: [256, 256]
  il:
    demos:
      path: "experts/demos/Rewarped_AllegroHand_demos128_return231_len546.pt"
      n_trajs: 8
    discriminator:
      mlp_kwargs:
        units: [256, 256]
logdir: "workdir/Rewarpedhand_reorient-GAIfO/$(date +%Y%m%d-%H%M%S.%2N)"
run: train_eval
seed: 100

sweep:
  seed: [100, 110, 120]

spawner:
  runtime: "12h"
