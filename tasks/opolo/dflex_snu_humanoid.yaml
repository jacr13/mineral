task:
  name: DFlex
  env:
    env_name: snu_humanoid
    no_grad: true
agent:
  name: OPOLO/DFlex
  sac:
    max_agent_steps: 10000000
    +target_entropy_scalar: 0.5
    tau: 0.005
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [512, 256]
    critic_kwargs:
      mlp_kwargs:
        units: [256, 256]
  il:
    demos:
      path: "experts/demos/DFlex_snu_demos128_return6246_len929.pt"
      n_trajs: 8
    discriminator:
      mlp_kwargs:
        units: [256, 256]
logdir: "workdir/DFlexSNUHumanoid-OPOLO/$(date +%Y%m%d-%H%M%S.%2N)"
run: train_eval
seed: 100

sweep:
  seed: [100, 110, 120, 1000, 1100, 1200]

spawner:
  runtime: "10h"
