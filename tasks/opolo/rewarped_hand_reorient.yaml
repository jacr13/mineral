task:
  name: Rewarped
  env:
    env_name: AllegroHand
    env_suite: isaacgymenvs
    no_grad: true
agent:
  name: OPOLO/DFlex
  sac:
    max_agent_steps: 4100000
    +target_entropy_scalar: 0.5
    tau: 0.005
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [512, 256]
    critic_kwargs:
      mlp_kwargs:
        units: [256, 256]
  il:
    demos:
      path: "experts/demos/Rewarped_AllegroHand_demos128_return231_len546.pt"
      n_trajs: 8
    discriminator:
      mlp_kwargs:
        units: [256, 256]
logdir: "workdir/Rewarpedhand_reorient-OPOLO/$(date +%Y%m%d-%H%M%S.%2N)"
run: train_eval
seed: 100

sweep:
  seed: [100, 110, 120]

spawner:
  runtime: "12h"
