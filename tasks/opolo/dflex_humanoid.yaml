task:
  name: DFlex
  env:
    env_name: humanoid
    no_grad: true
agent:
  name: OPOLO/DFlex
  sac:
    max_agent_steps: 10000000
    +target_entropy_scalar: 0.5
    tau: 0.005
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [256, 128]
    critic_kwargs:
      mlp_kwargs:
        units: [128, 128]
  il:
    demos:
      path: "experts/demos/DFlex_humanoid_demos128_return8116_len984.pt"
      n_trajs: 8
    discriminator:
      mlp_kwargs:
        units: [128, 128]
logdir: "workdir/DFlexHumanoid-OPOLO/$(date +%Y%m%d-%H%M%S.%2N)"
run: train_eval
seed: 100

sweep:
  seed: [100, 110, 120, 1000, 1100, 1200]

spawner:
  runtime: "9h"
