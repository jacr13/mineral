# MENTOR, frozen ICML configuration (X1, D1 approved 2026-11-16): Hopper, 8 demos.
# Same mechanisms on every DFlex task; per-task values (Stage I iterations / parametrisation, teacher horizon, gate)
# are reported in the paper's appendix. Source groups: `icml x1s0`, `icml x1s1` (mentor_icml/results/REPORT.md).
task:
  name: DFlex
  env:
    env_name: hopper
agent:
  name: MENTOR/DFlex
  mentor:
    rounds: 12
    demos:
      path: "experts/demos/DFlex_hopper_demos128_return4812_len1000.pt"
      n_trajs: 8
    invert:
      jacobian: broyden
      refresh_jacobian: autodiff
      refresh: 0
      iters: 20
    teacher:
      anchor_mix: 0.5
      batches_per_round: 9
      horizon: 8
    gate:
      # calibrated gate: tau = 10 x median teacher cost on noisy (0.2) replays of the Stage I actions
      auto_noise: 0.2
      auto_factor: 10
    rollout:
      length: 120
      reset_every: 60
      noise: 0.2
    augment:
      replay_batches: 12
      replay_steps: 16
      replay_noise: 0.2
logdir: "workdir/DFlexHopper-MENTOR-icml/$(date +%Y%m%d-%H%M%S.%2N)"
run: train_eval
seed: 100

sweep:
  seed: [100, 110, 120, 1000, 1100, 1200]

spawner:
  runtime: "2h"
