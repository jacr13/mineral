task:
  name: DFlex
  env:
    env_name: snu_humanoid
    no_grad: true
agent:
  name: PPO/DFlexAnt
  ppo:
    max_agent_steps: 10000000
  network:
    actor_critic_kwargs:
      mlp_kwargs:
        units: [512, 256]
      +critic_mlp_kwargs:
        units: [256, 256]
logdir: "workdir/DFlexSNUHumanoid10M-PPO/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 120

sweep:
  seed: [100, 110, 120, 130, 140]
