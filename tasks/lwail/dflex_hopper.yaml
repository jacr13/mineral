task:
  name: DFlex
  env:
    env_name: hopper
    no_grad: true
agent:
  name: LWAIL/DFlexAnt
  ddpg:
    max_agent_steps: 10000000
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [128, 64, 32]
    critic_kwargs:
      mlp_kwargs:
        units: [64, 64]
  lwail:
    demos:
      path: "experts/demos/DFlex_hopper_demos128_return4812_len1000.pt"
      n_trajs: 8
      subsample_factor: 20 # 0 means no subsampling, >1 means subsample by this factor
    input_type: state_state
    discriminator:
      mlp_kwargs:
        units: [64, 64]
    expert_batch_size: 2048
    policy_batch_size: 2048

logdir: "workdir/DFlexHopper10M-LWAIL/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 130

sweep:
  seed: [100, 110, 120, 1000, 1100, 1200]
  agent.lwail.demos.subsample_factor: 20
  agent.lwail.expert_batch_size: 2048
  agent.lwail.discriminator.iters: 30
  agent.lwail.gp_coef: 10
  agent.lwail.minus: true

spawner:
  runtime: "3h30m"
