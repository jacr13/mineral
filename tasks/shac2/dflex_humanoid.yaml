task:
  name: DFlex
  env:
    env_name: humanoid
agent:
  name: SHAC2/DFlexAnt
  shac:
    max_epochs: 5000
    max_agent_steps: 10000000
    critic_optim_kwargs:
      lr: 0.0005
    target_critic_alpha: 0.995
  network:
    actor_critic_kwargs:
      mlp_kwargs:
        units: [256, 128]
      critic_mlp_kwargs:
        units: [128, 128]
logdir: "workdir/DFlexHumanoid10M-SHAC2/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 110

sweep:
  seed: [100, 110, 120, 130, 140]
