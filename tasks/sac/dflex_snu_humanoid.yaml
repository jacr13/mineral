task:
  name: DFlex
  env:
    env_name: snu_humanoid
    no_grad: true
agent:
  name: DFlexAntSAC
  sac:
    max_agent_steps: 10000000
    target_entropy_scalar: 0.5
    tau: 0.005
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [512, 256]
    critic_kwargs:
      mlp_kwargs:
        units: [256, 256]
logdir: "workdir/DFlexSNUHumanoid10M-SAC/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 120

sweep:
  seed: [100, 110, 120, 130, 140]
