task:
  name: DFlex
  env:
    env_name: hopper
    no_grad: true
agent:
  name: SAC/DFlexAnt
  sac:
    max_agent_steps: 10000000
    +target_entropy_scalar: 0.5
    tau: 0.005
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [128, 64, 32]
    critic_kwargs:
      mlp_kwargs:
        units: [64, 64]
logdir: "workdir/DFlexHopper10M-SAC/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 130

sweep:
  seed: [100, 110, 120, 130, 140]
