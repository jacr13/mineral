task:
  name: Rewarped
  env:
    env_name: AllegroHand
    env_suite: isaacgymenvs
    no_grad: true
agent:
  name: DFlexAntSAC
  sac:
    max_agent_steps: 4100000
    +target_entropy_scalar: 0.5
    tau: 0.005
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [512, 256]
    critic_kwargs:
      mlp_kwargs:
        units: [256, 256]
logdir: "workdir/RewarpedAllegroHand4M-SAC/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 1100

sweep:
  seed: [100, 110, 120, 130, 140]

spawner:
  runtime: "2-00:00:00"
