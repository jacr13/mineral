# Seed-stability probe for FOCUS-OT-L2 on SNU Humanoid.
#
# Second seed-stability batch. Pooling the first batch (1 collapse in 12), the
# gradpath fixed-coupling arm (2/6) and the gradestimator pathwise arm (2/8)
# gives 5 collapses in 26 fresh seeds = 19%, mean 0.803 expert-normalized,
# against the paper's reported 0.905 from 6 seeds with no collapse. P(0
# collapses in 6 | p=0.19) = 0.28, so the reported batch is an ordinary draw.
# Twelve further disjoint seeds tighten that 19% enough to state it in the
# rebuttal without a reviewer being able to object to the sample size.
#
# Config below is the reported FOCUS-OT-L2 setup; only sweep.seed differs from
# tasks/otil/dflex_snu_humanoid.yaml.
task:
  name: DFlex
  env:
    env_name: snu_humanoid
agent:
  name: OTIL/DFlexAntSHAC
  shac:
    max_epochs: 50000
    max_agent_steps: 15000000
    critic_optim_kwargs:
      lr: 5e-4
    target_critic_alpha: 0.995
  otil:
    demos:
      path: "experts/demos/DFlex_snu_demos128_return6246_len929.pt"
      n_trajs: 8
    loss_best_of_k_k: 8
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [512, 256]
    critic_kwargs:
      mlp_kwargs:
        units: [256, 256]
logdir: "workdir/DFlexSNUHumanoid-OTIL-seedstability2/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 120

sweep:
  logdir: "workdir/DFlexSNUHumanoid-OTIL-seedstability2/$(date +%Y%m%d-%H%M%S.%2N)"
  seed: [300, 310, 320, 330, 340, 350, 3000, 3100, 3200, 3300, 3400, 3500]
  # agent.otil.loss_best_of_k_k: [1, 2, 4, 8, 16]
  agent.otil.demos.n_trajs: 8
  agent.otil.critic_disabled: false
  agent.otil.critic_reward_shapping: true
  agent.otil.critic_reward_mapping: exp # [log_exp, exp]
  agent.otil.imitation_loss_type: ot
  agent.otil.loss_ot_cost_type: l2 # [l2, cosine]
  agent.otil.loss_use_huber_speedup: false
  agent.otil.loss_mlp_features_dim: null
  agent.otil.loss_use_detached_prev_obs: false

spawner:
  runtime: "12h"
