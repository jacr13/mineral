task:
  name: DFlex
  env:
    env_name: snu_humanoid
agent:
  name: DFlexAntOTIL
  shac:
    max_epochs: 5000
    max_agent_steps: 10000000
    critic_optim_kwargs:
      lr: 5e-4
    target_critic_alpha: 0.995
  otil:
    demos:
      path: "experts/demos/DFlex_snu_demos128_return6246_len929.pt"
      n_trajs: 8
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [512, 256]
    critic_kwargs:
      mlp_kwargs:
        units: [256, 256]
logdir: "workdir/DFlexSNUHumanoid10M-OTIL/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 120

sweep:
  seed: [100, 110, 120]
  agent.otil.critic_reward_mapping: [log_exp, exp]
  # agent.otil.imitation_loss_type: [ot, l2]
  agent.otil.loss_ot_cost_type: [l2, cosine]
  agent.otil.loss_use_huber_speedup: false
  # agent.otil.loss_mlp_features_dim: null
  agent.otil.loss_use_detached_prev_obs: [true, false]
