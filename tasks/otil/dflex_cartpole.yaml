# FOCUS on DFlex CartPole Swing-Up -- the non-periodic, order-sensitive task
# both reviewers asked for.
#
# Q9cS: "All four tasks involve periodic locomotion, where the main differences
# are phase shifts and speed variations, but the paper does not evaluate
# non-periodic or order-sensitive tasks."
# zDN4: "Local best-of-K matching does not guarantee global ordering or
# coverage and may therefore fail on manipulation or non-periodic multi-stage
# tasks."
#
# Swing-up has two distinct phases -- pump energy in, then balance -- so a
# randomly sampled expert segment is frequently from a different phase than the
# agent currently occupies. That is exactly the predicted failure mode, which
# makes this a real test rather than a confirmatory one.
#
# obs = [x, xdot, sin(theta), cos(theta), theta_dot], act = 1, episode = 240.
#
# NOTE: cartpole returns are NEGATIVE, so the expert-normalised return used for
# the locomotion tasks is meaningless here (dividing by a negative flips the
# ordering). Report raw return, or normalise against a random-policy floor.
task:
  name: DFlex
  env:
    env_name: cartpoleswingup
agent:
  name: OTIL/DFlexAntSAPO
  shac:
    max_epochs: 2000
    max_agent_steps: 4000000
    horizon_len: 32
  otil:
    demos:
      path: "experts/demos/DFlex_cartpoleswingup_demos128.pt"
      n_trajs: 8
    loss_best_of_k_k: 8
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [64, 64]
    critic_kwargs:
      mlp_kwargs:
        units: [64, 64]
logdir: "workdir/DFlexCartpole4M-OTIL_SAPO/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 100

sweep:
  seed: [100, 110, 120, 1000, 1100, 1200]

spawner:
  runtime: "4h"
