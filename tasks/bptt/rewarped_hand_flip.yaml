task:
  name: Rewarped
  env:
    env_name: Flip
    env_suite: dexdeform
agent:
  name: RewarpedJumperBPTT
  network:
    encoder_kwargs:
      mlp_keys: "com_q|joint_q"
    actor_kwargs:
      mlp_kwargs:
        units: [512, 256]
logdir: "workdir/RewarpedDexDeformFlip6M-BPTT/$(date +%Y%m%d-%H%M%S)"
num_envs: 32
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 1400

sweep:
  seed: [100, 110, 120, 130, 140]

spawner:
  runtime: "2-00:00:00"
