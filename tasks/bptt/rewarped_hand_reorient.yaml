task:
  name: Rewarped
  env:
    env_name: AllegroHand
    env_suite: isaacgymenvs
agent:
  name: BPTT/DFlexAnt
  bptt:
    max_epochs: 2000
    max_agent_steps: 4100000
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [512, 256]
logdir: "workdir/RewarpedAllegroHand4M-BPTT/$(date +%Y%m%d-%H%M%S)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 1100

sweep:
  seed: [100, 110, 120, 130, 140]

spawner:
  runtime: "2-00:00:00"
