# Expert for DFlex CartPole Swing-Up.
#
# Reviewers Q9cS and zDN4 both object that every task in the paper is periodic
# locomotion ("the paper does not evaluate non-periodic or order-sensitive
# tasks"; "may therefore fail on manipulation or non-periodic multi-stage
# tasks"). Swing-up is the cheapest honest test: the trajectory has two
# distinct phases -- recover from a perturbed state, then balance it -- so a
# randomly sampled expert segment is often from a different phase than the
# agent is in, which is precisely the failure mode predicted for local
# best-of-K matching.
#
#
# NOTE on stochastic_init (corrected 9 Nov 2026): the line below is explicit
# documentation, not a fix. mineral/cfgs/task/DFlex.yaml already sets
# stochastic_init: True for every DFlex task, so the original cartpole runs
# always had randomized starts and are VALID. An earlier note here claimed the
# task was degenerate; that was wrong. The probe behind it built the env by
# hand via plotter/render_rollout.make_env, which hardcoded
# stochastic_init=False, so it measured a configuration training never used.
# Note also that stochastic_init_func is overridden per environment:
# CartPoleSwingUpEnv's adds pi*(U-0.5) to every joint position, while AntEnv's
# is mild (xyz +-0.05, orientation +-pi/24, joints +-0.1). Reading cartpole's
# and assuming it was generic is what produced the bogus diagnosis.
#
# obs = [x, xdot, sin(theta), cos(theta), theta_dot] (5), act = 1,
# episode_length = 240, so this is far cheaper than the locomotion tasks.
task:
  name: DFlex
  env:
    env_name: cartpoleswingup
    # Redundant with mineral/cfgs/task/DFlex.yaml, kept explicit so the
    # initial-state distribution of this task is readable here.
    stochastic_init: True
agent:
  name: SAPO/DFlexAnt
  shac:
    max_epochs: 2000
    max_agent_steps: 4000000
    horizon_len: 32
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [64, 64]
    critic_kwargs:
      mlp_kwargs:
        units: [64, 64]
logdir: "workdir/DFlexCartpole4M-SAPO/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 130

sweep:
  seed: [100, 110, 120, 130, 140]

spawner:
  # The other tasks/sapo/*.yaml carry skip: true so that already-trained
  # experts are not respawned by a bulk launch. This expert does not exist yet,
  # so it must be spawnable.
  skip: false
  runtime: "4h"
