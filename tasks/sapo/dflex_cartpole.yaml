# Expert for DFlex CartPole Swing-Up.
#
# Reviewers Q9cS and zDN4 both object that every task in the paper is periodic
# locomotion ("the paper does not evaluate non-periodic or order-sensitive
# tasks"; "may therefore fail on manipulation or non-periodic multi-stage
# tasks"). Swing-up is the cheapest honest test: the trajectory has two
# distinct phases -- recover from a perturbed state, then balance it -- so a
# randomly sampled expert segment is often from a different phase than the
# agent is in, which is precisely the failure mode predicted for local
# best-of-K matching. This requires stochastic_init: True (see below).
#
#
# MEASURED 2026-11-09, before fixing stochastic_init:
#   with stochastic_init=False (the dflex default, which this file previously
#   inherited) every episode starts at x=0, theta=0, zero velocities -- i.e.
#   exactly at the upright unstable equilibrium. A zero-action policy then
#   scores EXACTLY 0.00 and never moves (mean|theta| = 0.000 over 240 steps),
#   so the optimal policy is to do nothing and there is no swing-up phase at
#   all. The SAPO expert scored -316.6, far WORSE than doing nothing, because
#   the entropy bonus forces it to act. The task was therefore degenerate and
#   could not test non-periodic multi-phase behaviour.
#   With stochastic_init=True (what DiffRL's own cfg/env/cartpole.yaml uses):
#   zero-action = -1670.7, uniform-random = -1733.4, so active recovery is
#   required and the task has real phase structure.
#
# obs = [x, xdot, sin(theta), cos(theta), theta_dot] (5), act = 1,
# episode_length = 240, so this is far cheaper than the locomotion tasks.
task:
  name: DFlex
  env:
    env_name: cartpoleswingup
    # REQUIRED: without this the start state is the upright equilibrium and the
    # optimal policy is the null action (see the measurement note above).
    stochastic_init: True
agent:
  name: SAPO/DFlexAnt
  shac:
    max_epochs: 2000
    max_agent_steps: 4000000
    horizon_len: 32
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [64, 64]
    critic_kwargs:
      mlp_kwargs:
        units: [64, 64]
logdir: "workdir/DFlexCartpole4M-SAPO/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 130

sweep:
  seed: [100, 110, 120, 130, 140]

spawner:
  # The other tasks/sapo/*.yaml carry skip: true so that already-trained
  # experts are not respawned by a bulk launch. This expert does not exist yet,
  # so it must be spawnable.
  skip: false
  runtime: "4h"
