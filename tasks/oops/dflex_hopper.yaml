task:
  name: DFlex
  env:
    env_name: hopper
    no_grad: true
    # OOPS assumes explore_env collects one continuous, unbroken episode of
    # exactly ddpg.horizon_len steps (it OT-matches the whole thing against
    # one continuous expert trajectory of the same length). DFlex envs
    # auto-reset internally on early termination (dflex_env.py's step()),
    # which would splice unrelated episodes together mid-rollout -- the
    # reference implementation instead keeps stepping through a fallen/
    # terminal state for the rest of the fixed-length block. Disable it here
    # so the invariant holds.
    early_termination: false
agent:
  name: OOPS/DFlexAnt
  ddpg:
    max_agent_steps: 10000000
    horizon_len: 1000 # must match the demos' episode length
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [128, 64, 32]
    critic_kwargs:
      mlp_kwargs:
        units: [64, 64]
  oops:
    demos:
      path: "experts/demos/DFlex_hopper_demos128_return4812_len1000.pt"
      n_trajs: 8
      subsample_factor: 1
logdir: "workdir/DFlexHopper10M-OOPS/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 130

sweep:
  seed: [100, 110, 120, 1000, 1100, 1200]
  # agent.oops.sinkhorn_eps: [0.01, 0.05, 0.1]  (0.05 matches the paper's reported lamda1)
  agent.oops.sinkhorn_eps: 0.05
  # agent.oops.reward_scale: [1.0, 5.0, 10.0]  (5.0 matches the paper's reported reward_scale)
  agent.oops.reward_scale: 5.0
  # agent.oops.state_action: [true, false]  (false matches the paper's reported runs)
  agent.oops.state_action: false
  # agent.oops.aug_time: [true, false]  (true matches the paper's reported --aug_time runs)
  agent.oops.aug_time: true
  # sinkhorn convergence vs. per-episode compute: 1000 is the repo default,
  # 20000 matches the paper's own reported Hopper run.
  agent.oops.sinkhorn_iters: [1000, 5000, 20000]

spawner:
  runtime: "3h30m"
