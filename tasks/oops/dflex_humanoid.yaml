task:
  name: DFlex
  env:
    env_name: humanoid
    no_grad: true
agent:
  name: OOPS/DFlexAnt
  ddpg:
    max_agent_steps: 10000000
    horizon_len: 984 # must match the demos' episode length
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [256, 128]
    critic_kwargs:
      mlp_kwargs:
        units: [128, 128]
  oops:
    demos:
      path: "experts/demos/DFlex_humanoid_demos128_return8116_len984.pt"
      n_trajs: 8
      subsample_factor: 1
logdir: "workdir/DFlexHumanoid10M-OOPS/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 110

sweep:
  seed: [100, 110, 120]
  agent.oops.sinkhorn_eps: [0.01, 0.05, 0.1]
  agent.oops.reward_scale: [1.0, 5.0, 10.0]
  agent.oops.state_action: [true, false]
  agent.oops.aug_time: [true, false]

spawner:
  runtime: "7h30m"
