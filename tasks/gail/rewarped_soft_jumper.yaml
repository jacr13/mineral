task:
  name: Rewarped
  env:
    env_name: Jumper
    env_suite: gradsim
    no_grad: True

agent:
  name: GAIL/RewarpedJumper
  network:
    encoder_kwargs:
      mlp_keys: "com_q|com_qd|actions"
    actor_critic_kwargs:
      mlp_kwargs:
        units: [512, 256]
      +critic_mlp_kwargs:
        units: [256, 256]

  gail:
    demos:
      path: "experts/demos/Rewarped_Jumper_demos64_return2046_len300.pt"
      n_trajs: 8
      subsample_factor: 20 # 1 means no subsampling, >1 means subsample by this factor
    input_type: state_state
    disc_update_freq: 5
    discriminator:
      iters: 1
      mlp_kwargs:
        units: [256, 256]
        norm_type: LayerNorm
        act_type: SiLU
      optim:
        type: Adam
        kwargs: { lr: 3e-4 }
    expert_batch_size: 2048
    policy_batch_size: 2048
    reward_scale: 1.0
    label_smooth: 0.0

logdir: "workdir/RewarpedJumper6M-GAIL/$(date +%Y%m%d-%H%M%S.%2N)"
num_envs: 32
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 1300

sweep:
  seed: [100, 110, 120, 130, 140]

spawner:
  runtime: "2-00:00:00"
