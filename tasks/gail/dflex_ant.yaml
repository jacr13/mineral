task:
  name: DFlex
  env:
    env_name: ant
    no_grad: true
agent:
  name: GAIL/DFlex
  ppo:
    max_agent_steps: 10000000
  network:
    actor_critic_kwargs:
      mlp_kwargs:
        units: [128, 64, 32]
      +critic_mlp_kwargs:
        units: [64, 64]
  il:
    demos:
      path: "experts/demos/DFlex_ant_demos128_return9318_len1000.pt"
      n_trajs: 8
    discriminator:
      mlp_kwargs:
        units: [128, 128]
logdir: "workdir/DFlexAnt-GAIL/$(date +%Y%m%d-%H%M%S.%2N)"
run: train_eval
seed: 100

sweep:
  seed: [100, 110, 120, 1000, 1100, 1200]

spawner:
  runtime: "5h"
