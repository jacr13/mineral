task:
  name: Rewarped
  env:
    env_name: Ant
    env_suite: dflex
    no_grad: true
agent:
  name: GAIL/DFlexAnt
  ppo:
    max_agent_steps: 4100000
  network:
    actor_critic_kwargs:
      mlp_kwargs:
        units: [128, 64, 32]
      +critic_mlp_kwargs:
        units: [64, 64]
  gail:
    demos:
      path: "experts/demos/Rewarped_Ant_demos128_return4893_len1000.pt"
      n_trajs: 8
      subsample_factor: 20 # 0 means no subsampling, >1 means subsample by this factor
    input_type: state_action
    disc_update_freq: 5
    discriminator:
      iters: 1
      mlp_kwargs:
        units: [64, 64]
        norm_type: LayerNorm
        act_type: SiLU
      optim:
        type: Adam
        kwargs: { lr: 3e-4 }
    expert_batch_size: 2048
    policy_batch_size: 2048
    reward_scale: 1.0
    label_smooth: 0.0
logdir: "workdir/RewarpedAnt4M-GAIL/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 1000

sweep:
  seed: [100, 110, 120, 130, 140]

spawner:
  runtime: "2-00:00:00"
