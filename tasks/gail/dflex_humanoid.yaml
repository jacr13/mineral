task:
  name: DFlex
  env:
    env_name: humanoid
    no_grad: true
agent:
  name: DFlexAntGAIL
  ppo:
    max_agent_steps: 10000000
  network:
    actor_critic_kwargs:
      mlp_kwargs:
        units: [256, 128]
      +critic_mlp_kwargs:
        units: [128, 128]
  gail:
    demos:
      path: "experts/demos/DFlex_humanoid_demos128_return8116_len984.pt"
      n_trajs: 10
      subsample_factor: 20 # 0 means no subsampling, >1 means subsample by this factor
    input_type: state_action
    disc_update_freq: 5
    discriminator:
      iters: 1
      mlp_kwargs:
        units: [128, 64]
        norm_type: LayerNorm
        act_type: SiLU
      optim:
        type: Adam
        kwargs: { lr: 3e-4 }
    expert_batch_size: 2048
    policy_batch_size: 2048
    reward_scale: 1.0
    label_smooth: 0.0
logdir: "workdir/DFlexHumanoid10M-GAIL/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 110

sweep:
  seed: [100, 110, 120, 130, 140]
