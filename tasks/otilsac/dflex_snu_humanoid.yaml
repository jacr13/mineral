task:
  name: DFlex
  env:
    env_name: snu_humanoid
    no_grad: true
agent:
  name: OTIL/DFlexAntSAC
  sac:
    max_agent_steps: 10000000
    warm_up: 32
    +target_entropy_scalar: 0.5
    tau: 0.005
  otil:
    demos:
      path: "experts/demos/DFlex_snu_demos128_return6246_len929.pt"
      n_trajs: 8
    input_type: state_state
    imitation_loss_type: ot
    loss_best_of_k_k: 8
    loss_ot_cost_type: l2
    loss_use_huber_speedup: false
    loss_use_detached_prev_obs: false
    loss_mlp_features_dim: 64
    critic_reward_mapping: exp
    critic_reward_shapping: false
  network:
    actor_kwargs:
      mlp_kwargs:
        units: [512, 256]
    critic_kwargs:
      mlp_kwargs:
        units: [256, 256]
logdir: "workdir/DFlexSNUHumanoid10M-OTIL_SAC/$(date +%Y%m%d-%H%M%S.%2N)"
wandb:
  mode: online
  project: rewarped
run: train_eval
seed: 120

sweep:
  seed: [100, 110, 120, 1000, 1100, 1200]
