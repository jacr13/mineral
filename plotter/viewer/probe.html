<!doctype html><html><body style="margin:0;background:#fff">
<canvas id="c" width="400" height="400"></canvas>
<script type="module">
import * as THREE from './three.module.js';
const cv = document.getElementById('c');
const r = new THREE.WebGLRenderer({canvas: cv, antialias: true});
r.setSize(400, 400, false); r.shadowMap.enabled = true;
r.setClearColor(0xeef1f5, 1);
const sc = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(35, 1, 0.1, 50);
cam.position.set(2.2, 1.3, 2.6); cam.lookAt(0, 0.5, 0);
const dl = new THREE.DirectionalLight(0xffffff, 2.2);
dl.position.set(3, 6, 2); dl.castShadow = true;
dl.shadow.mapSize.set(1024, 1024);
dl.shadow.camera.left = dl.shadow.camera.bottom = -4;
dl.shadow.camera.right = dl.shadow.camera.top = 4;
sc.add(dl, new THREE.AmbientLight(0xffffff, 0.55), new THREE.HemisphereLight(0xbfd4ff, 0x404040, 0.5));
const g = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({color: 0xd8dde3, roughness: 0.95}));
g.rotation.x = -Math.PI / 2; g.receiveShadow = true; sc.add(g);
const m = new THREE.MeshStandardMaterial({color: 0x2b6cb0, roughness: 0.42, metalness: 0.05});
const cap = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.85, 12, 20), m);
cap.position.set(0, 0.72, 0); cap.rotation.z = 0.35; cap.castShadow = true; sc.add(cap);
const cap2 = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.6, 12, 20), m);
cap2.position.set(0.42, 0.33, 0.1); cap2.rotation.z = -0.8; cap2.castShadow = true; sc.add(cap2);
r.render(sc, cam);
document.title = "ready-" + THREE.REVISION;
</script></body></html>
